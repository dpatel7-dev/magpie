<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>magpie</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* The picker: small and quick. Type to find, Enter to copy, and it's gone. */
:root { color-scheme: light dark; --paper: #fff; --ink: #16181d; --muted: #646b78; --faint: #9aa1ad; --line: rgba(22, 24, 29, .09); --field: #f4f5f7; --pick: rgba(47, 98, 184, .1); --blue: #2f62b8;
  --sheen: linear-gradient(180deg, #2f62b8, #1f7f78 55%, #6a4fd8); --mono: ui-monospace, "SF Mono", Menlo, monospace; }
@media (prefers-color-scheme: dark) { :root { --paper: #000; --ink: #eef0f4; --muted: #a3aab8; --faint: #6b7282; --line: rgba(255, 255, 255, .1); --field: #14161d; --pick: rgba(127, 176, 255, .14); --blue: #7fb0ff;
  --sheen: linear-gradient(180deg, #7fb0ff, #5fd6c4 55%, #a993ff); } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
header { display: flex; align-items: center; gap: 10px; padding: 12px 12px 8px; }
#pica { width: 28px; height: 21px; image-rendering: pixelated; flex: none; }
input { flex: 1; min-width: 0; font: inherit; font-size: 17px; border: 0; outline: none; background: none; padding: 6px 2px; color: var(--ink); }
.tabs { display: flex; gap: 4px; padding: 0 12px 8px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; color: var(--muted); font: 600 12px/1 inherit; padding: 5px 8px; border-radius: 7px; cursor: pointer; }
.tabs button[aria-pressed=true] { background: var(--pick); color: var(--ink); }
ul { list-style: none; margin: 0; padding: 6px; overflow: auto; flex: 1; }
li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 0 8px; padding: 7px 8px 7px 6px; border-radius: 9px; cursor: pointer; position: relative; }
li.on { background: var(--pick); }
li.on::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 3px; border-radius: 3px; background: var(--sheen); }
.n { font: 600 11px/1.9 var(--mono); color: var(--faint); text-align: center; }
.t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t.code { font: 12.5px/1.6 var(--mono); }
.t img { height: 34px; border-radius: 5px; vertical-align: middle; border: 1px solid var(--line); }
.t .sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; border: 1px solid var(--line); }
.m { grid-column: 2; color: var(--faint); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m .gem { display: inline-block; width: 7px; height: 7px; transform: rotate(45deg); background: var(--sheen); margin-right: 5px; border-radius: 1px; }
footer { display: flex; gap: 12px; padding: 8px 14px; border-top: 1px solid var(--line); color: var(--faint); font-size: 11.5px; }
footer b { color: var(--muted); font-weight: 600; }
.done { position: fixed; inset: 0; display: grid; place-items: center; background: var(--paper); font-size: 17px; font-weight: 650; }
.done span { color: var(--muted); font-weight: 400; font-size: 14px; display: block; text-align: center; margin-top: 4px; }
.empty { padding: 30px 18px; text-align: center; color: var(--muted); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header><canvas id="pica" width="12" height="9" aria-hidden="true"></canvas><input id="q" placeholder="Find something you copied" autocomplete="off" spellcheck="false" aria-label="Find"></header>
<nav class="tabs" id="tabs"></nav>
<ul id="list" role="listbox" aria-label="What you copied"></ul>
<footer><span><b>↩</b> copy</span><span><b>⌘1–9</b> pick</span><span><b>⌘P</b> pin</span><span><b>esc</b> close</span></footer>
<div class="done" id="done" hidden><div>Copied<span>Press ⌘V to paste it</span></div></div>
<script id="config" type="application/json">__CONFIG__</script>
<script>
(function () {
  'use strict';
  var C = JSON.parse(document.getElementById('config').textContent);
  var $ = function (id) { return document.getElementById(id); };
  var TABS = [['', 'All'], ['pinned', 'Pinned'], ['link', 'Links'], ['code', 'Code'], ['image', 'Pictures']];
  var st = { list: [], at: 0, kind: '', q: '' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ago(t) { var s = (Date.now() - t) / 1000; if (s < 50) return 'just now'; if (s < 3600) return Math.round(s / 60) + ' min'; if (s < 86400) return Math.round(s / 3600) + ' h'; return Math.round(s / 86400) + ' d'; }
  function api(what, body) { return fetch(C.base + '/api/' + what, { method: 'POST', headers: { 'content-type': 'application/json', 'x-magpie': C.secret }, body: JSON.stringify(body || {}) }).then(function (r) { return r.json(); }); }
  var PICA = ['............', '........kkk.', '.......kKEKY', '.......KKKk.', '.....kBbKWW.', '..GkBBWBWWW.', 'gGGkKKKKww..', 'g......L.L..', '............'];
  var INK = { K: '#15171c', k: '#3a4150', W: '#f7f7f4', w: '#c9ced6', B: '#2f62b8', b: '#6a9be6', G: '#1f7f78', g: '#45bfae', E: '#fff', L: '#4a505c', Y: '#59606e' };
  if (matchMedia('(prefers-color-scheme: dark)').matches) { INK.K = '#2a3042'; INK.k = '#6a7694'; }
  var g = $('pica').getContext('2d');
  PICA.forEach(function (row, y) { row.split('').forEach(function (ch, x) { if (INK[ch]) { g.fillStyle = INK[ch]; g.fillRect(x, y, 1, 1); } }); });

  function tabs() { $('tabs').innerHTML = TABS.map(function (t) { return '<button data-k="' + t[0] + '" aria-pressed="' + (st.kind === t[0]) + '">' + t[1] + '</button>'; }).join(''); }
  function show(c) {
    if (c.kind === 'image') return '<img alt="" src="' + esc(c.src) + '"> picture ' + (c.w || '') + (c.w ? '×' + c.h : '');
    var t = (c.text || '').replace(/\s+/g, ' ').trim();
    if (c.kind === 'color') return '<span class="sw" style="background:' + esc(t) + '"></span>' + esc(t);
    return esc(t.slice(0, 160));
  }
  function render() {
    var L = $('list');
    if (!st.list.length) { L.innerHTML = '<li class="empty">' + (st.q ? 'Nothing matches.' : 'Nothing copied yet.') + '</li>'; return; }
    L.innerHTML = st.list.map(function (c, i) {
      return '<li role="option" data-i="' + i + '" class="' + (i === st.at ? 'on' : '') + '" aria-selected="' + (i === st.at) + '"><span class="n">' + (i < 9 ? i + 1 : '') + '</span><span class="t' + (c.kind === 'code' ? ' code' : '') + '">' + (c.name ? '<b>' + esc(c.name) + '</b> · ' : '') + show(c) + '</span>' +
        '<span class="m">' + (c.pin ? '<span class="gem"></span>' : '') + ago(c.at) + (c.app ? ' · ' + esc(c.app) : '') + '</span></li>';
    }).join('');
    var on = L.querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest' });
  }
  function load() {
    api('list', { q: st.q, kind: st.kind, limit: 80 }).then(function (r) { st.list = r.clips; st.at = Math.min(st.at, Math.max(0, st.list.length - 1)); render(); });
  }
  var closing = false;
  function pick(i) {
    var c = st.list[i];
    if (!c || closing) return;
    closing = true;
    api('use', { id: c.id, back: true }).then(function () {
      $('done').hidden = false;
      setTimeout(function () { window.close(); }, 450);
    });
  }
  $('q').addEventListener('input', function () { st.q = this.value; st.at = 0; load(); });
  $('tabs').onclick = function (e) { var b = e.target.closest('[data-k]'); if (!b) return; st.kind = b.dataset.k; st.at = 0; tabs(); load(); $('q').focus(); };
  $('list').onclick = function (e) { var li = e.target.closest('[data-i]'); if (li) pick(Number(li.dataset.i)); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { window.close(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); st.at = Math.min(st.list.length - 1, st.at + 1); render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); st.at = Math.max(0, st.at - 1); render(); }
    else if (e.key === 'Enter') { e.preventDefault(); pick(st.at); }
    else if ((e.metaKey || e.ctrlKey) && /^[1-9]$/.test(e.key)) { e.preventDefault(); pick(Number(e.key) - 1); }
    else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'p') { e.preventDefault(); var c = st.list[st.at]; if (c) api('pin', { id: c.id, on: !c.pin }).then(load); }
    else if (e.key === 'Tab') { e.preventDefault(); var i = TABS.findIndex(function (t) { return t[0] === st.kind; }); st.kind = TABS[(i + (e.shiftKey ? TABS.length - 1 : 1)) % TABS.length][0]; st.at = 0; tabs(); load(); }
  });
  window.addEventListener('blur', function () { if (!closing) setTimeout(function () { if (!document.hasFocus()) window.close(); }, 300); });
  tabs(); load(); $('q').focus();
})();
</script>
</body>
</html>
